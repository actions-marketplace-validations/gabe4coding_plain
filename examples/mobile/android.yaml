# See README.md in this directory for SDK, Appium and model setup.
# The hook builds/installs the offline fixture, then uninstalls it after the run.
name: Android native preview
platform: android
device: "${env.device}"
app: dev.plain.fixture
capabilities:
  appium:appActivity: .MobileAndroidFixture
env:
  device: $PLAIN_MOBILE_DEVICE
hooks: ../hooks/mobile-fixture.mjs
steps:
  - fill: { target: the Message text field, value: Android adapter works }
  - press: HideKeyboard
  - check: the Enable preview switch
  - check: the Enable preview switch
  - uncheck: the Enable preview switch
  - check: the Enable preview switch
  - tap: the Preview button
  - expect: The preview says Android adapter works
  - longpress: the Hold for details button
  - expect: 'The details label says "Details are visible"'
  - scroll: "down: the Fixture results list"
  - swipe: down

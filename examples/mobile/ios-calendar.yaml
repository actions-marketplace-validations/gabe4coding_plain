# Creates a Calendar event on the 15th of next month and finds it again with Search.
# English (UK) locale. Calendar reopens on the last screen it showed. The last steps close the event and Search,
# so the next run starts on the main view and takes the same path (a replay with --mode no-judge needs that). The
# optional first steps recover from a run that stopped halfway: an open event, Search, or an unsaved event.
# The hook computes the date and a title unique to each run, so the spec works on any day and
# leftovers from earlier runs never match. Each run adds one event to the simulator's calendar.
# Set PLAIN_MOBILE_DEVICE to the booted iOS simulator's UDID.
name: Create and verify a Calendar appointment
goal: Create a Calendar event on a given date and find it again with Search
platform: ios
device: "${env.device}"
app: com.apple.mobilecal
hooks: ../hooks/ios-calendar.mjs
env:
  device: $PLAIN_MOBILE_DEVICE
steps:
  # An event opened from Search: its sheet shrinks on Cancel (its X button), and closing Search closes the rest.
  - tap: the Cancel button of the event details sheet
    optional: true
  - tap: the Close button next to the Search field
    optional: true
  # An unsaved new event asks before it closes.
  - tap: the Close button of the New Event sheet
    optional: true
  - tap: the Discard Changes button
    optional: true
  # Today also resets the month that a new event takes as its default date.
  - tap: the Today button
  # Scoped to the navigation bar: the day view below scrolls to the current time, which changes each run.
  - wait: {that: "Calendar's main view is visible with Add and Search buttons.", within: the navigation bar with the Add and Search buttons}
  - tap: the Add button
  - fill:
      target: the event title text field
      value: "${hooks.title}"
  # The keyboard and an "AutoFill from past events" popup cover the date button: Return hides the
  # keyboard, a tap on the Options label closes the popup (both harmless when there is none).
  - tap: the Return key on the keyboard
  - tap: the Options section label text
  - tap: the event date and time summary button below the title
  - tap: the Starts date button, above Ends
  - tap: the Next Month button in the Starts date picker
  # The month slides in: until the animation ends the tree lists only a few of its days.
  - wait: {that: "The ${hooks.day} date button is shown", within: the Starts date picker}
  - tap: the ${hooks.day} date button
  - expect: The event title is ${hooks.title} and it starts on ${hooks.date}.
  - tap: the Done button in the New Event navigation bar to save the event
  - tap: the Search button
  - fill:
      target: the Search field
      value: "${hooks.title}"
  - wait: The Events results list contains a ${hooks.title} event row.
  - tap: the ${hooks.title} event row in the Events results list
  - expect: The ${hooks.title} event is scheduled on ${hooks.date}.
  # Back to the main view, where the next run starts.
  - tap: the Cancel button of the event details sheet
  - tap: the Close button next to the Search field
  - tap: the Today button

---
name: Plain
description: >-
  Run Plain YAML specs with JUnit reporting and failure artifacts
inputs:
  specs:
    description: Space-separated spec files, directories, or globs
    required: true
  args:
    description: Extra Plain CLI flags
    required: false
    default: ''
  picks:
    description: >-
      Pick cache mode (on, read or off); read reuses committed *.picks.json
      sidecars without writing them. Empty passes no --picks flag
    required: false
    default: read
  junit:
    description: >-
      JUnit XML output path, uploaded on every run; empty disables the
      JUnit reporter and its upload
    required: false
    default: plain-results/junit.xml
  artifacts:
    description: >-
      Directory for screenshots and traces, uploaded when the run fails;
      empty disables capture and the upload
    required: false
    default: plain-results
  artifact-name:
    description: >-
      Name of the uploaded failure artifact; the JUnit report is uploaded as
      <artifact-name>-junit. Both must be unique in the workflow run
      (in a matrix, give each job its own name)
    required: false
    default: plain-results
  node-version:
    description: Node.js version
    required: false
    default: '22'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    # The npm release of the version in the action's package.json, so the action ref and the runtime agree.
    - name: Install Plain
      id: install
      shell: bash
      run: |
        prefix="$RUNNER_TEMP/plain"
        package="$(node -p "const p = require(process.argv[1]); p.name + '@' + p.version" "$GITHUB_ACTION_PATH/package.json")"
        if ! npm install --prefix "$prefix" --no-audit --no-fund --no-save "$package"; then
          echo "::error::Cannot install $package from npm. The Publish workflow of gabe4coding/plain publishes a version after it reaches main. Pin the action to a release tag (v<version>), or wait for that workflow." >&2
          exit 1
        fi
        echo "bin=$prefix/node_modules/.bin" >> "$GITHUB_OUTPUT"
    - name: Install Chromium and system dependencies
      shell: bash
      run: '"${{ steps.install.outputs.bin }}/playwright" install --with-deps chromium'
    # Trimmed once here, so the run and the upload conditions agree on what counts as empty.
    - name: Resolve output paths
      id: paths
      shell: bash
      env:
        PLAIN_ACTION_JUNIT: ${{ inputs.junit }}
        PLAIN_ACTION_ARTIFACTS: ${{ inputs.artifacts }}
      run: |
        python3 - <<'PY'
        import os

        with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            for key in ('junit', 'artifacts'):
                value = os.environ[f'PLAIN_ACTION_{key.upper()}'].strip()
                if '\n' in value:
                    raise SystemExit(f'{key}: a path cannot contain a line break')
                out.write(f'{key}={value}\n')
        PY
    - name: Run specs
      shell: bash
      env:
        PLAIN_ACTION_BIN: ${{ steps.install.outputs.bin }}
        PLAIN_ACTION_ARGS: ${{ inputs.args }}
        PLAIN_ACTION_SPECS: ${{ inputs.specs }}
        PLAIN_ACTION_PICKS: ${{ inputs.picks }}
        PLAIN_ACTION_JUNIT: ${{ steps.paths.outputs.junit }}
        PLAIN_ACTION_ARTIFACTS: ${{ steps.paths.outputs.artifacts }}
      run: |
        python3 - <<'PY'
        import os
        import shlex
        import subprocess
        import sys

        picks = os.environ['PLAIN_ACTION_PICKS'].strip()
        junit = os.environ['PLAIN_ACTION_JUNIT']
        artifacts = os.environ['PLAIN_ACTION_ARTIFACTS']
        command = [
            f"{os.environ['PLAIN_ACTION_BIN']}/plain",
            '--headless', '--reporter', 'text',
        ]
        if picks:
            command += ['--picks', picks]
        if junit:
            command += ['--reporter', f'junit:{junit}']
        if artifacts:
            command += ['--artifacts', artifacts]
        # Extra args come after the action's flags, so a --picks in args wins.
        command += shlex.split(os.environ['PLAIN_ACTION_ARGS'])
        command += shlex.split(os.environ['PLAIN_ACTION_SPECS'])
        sys.exit(subprocess.call(command))
        PY
    - name: Upload JUnit report
      if: always() && steps.paths.outputs.junit != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}-junit
        path: ${{ steps.paths.outputs.junit }}
        if-no-files-found: warn
    - name: Upload failure artifacts
      if: failure() && steps.paths.outputs.artifacts != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.paths.outputs.artifacts }}

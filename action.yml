---
name: Plainwright
description: >-
  Run Plainwright YAML specs with JUnit reporting and failure artifacts
inputs:
  specs:
    description: Space-separated spec files, directories, or globs
    required: true
  args:
    description: Extra Plainwright CLI flags
    required: false
    default: ''
  picks:
    description: >-
      Pick cache mode (on, read or off); read reuses committed *.picks.json
      sidecars without writing them. Empty passes no --picks flag
    required: false
    default: read
  junit:
    description: >-
      JUnit XML output path, uploaded on every run; empty disables the
      JUnit reporter and its upload
    required: false
    default: plainwright-results/junit.xml
  artifacts:
    description: >-
      Directory for screenshots and traces, uploaded when the run fails;
      empty disables capture and the upload
    required: false
    default: plainwright-results
  artifact-name:
    description: >-
      Name of the uploaded failure artifact; the JUnit report is uploaded as
      <artifact-name>-junit. Both must be unique in the workflow run
      (in a matrix, give each job its own name)
    required: false
    default: plainwright-results
  node-version:
    description: Node.js version
    required: false
    default: '22'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install Plainwright dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev
    - name: Install Chromium and system dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npx playwright install --with-deps chromium
    - name: Run specs
      shell: bash
      env:
        PLAINWRIGHT_ACTION_ARGS: ${{ inputs.args }}
        PLAINWRIGHT_ACTION_SPECS: ${{ inputs.specs }}
        PLAINWRIGHT_ACTION_PICKS: ${{ inputs.picks }}
        PLAINWRIGHT_ACTION_JUNIT: ${{ inputs.junit }}
        PLAINWRIGHT_ACTION_ARTIFACTS: ${{ inputs.artifacts }}
      run: |
        python3 - <<'PY'
        import os
        import shlex
        import subprocess
        import sys

        picks = os.environ['PLAINWRIGHT_ACTION_PICKS'].strip()
        junit = os.environ['PLAINWRIGHT_ACTION_JUNIT'].strip()
        artifacts = os.environ['PLAINWRIGHT_ACTION_ARTIFACTS'].strip()
        command = [
            'node', f"{os.environ['GITHUB_ACTION_PATH']}/dist/cli.js",
            '--headless', '--reporter', 'text',
        ]
        if picks:
            command += ['--picks', picks]
        if junit:
            command += ['--reporter', f'junit:{junit}']
        if artifacts:
            command += ['--artifacts', artifacts]
        # Extra args come after the action's flags, so a --picks in args wins.
        command += shlex.split(os.environ['PLAINWRIGHT_ACTION_ARGS'])
        command += shlex.split(os.environ['PLAINWRIGHT_ACTION_SPECS'])
        sys.exit(subprocess.call(command))
        PY
    - name: Upload JUnit report
      if: always() && inputs.junit != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}-junit
        path: ${{ inputs.junit }}
        if-no-files-found: warn
    - name: Upload failure artifacts
      if: failure() && inputs.artifacts != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifacts }}

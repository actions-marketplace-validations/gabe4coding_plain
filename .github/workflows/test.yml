name: Test

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The same key-free gate an agent runs before it reports a change done (CLAUDE.md "Validation").
      - run: npm run verify
      - name: Check generated plugin files
        shell: bash
        run: |
          changed="$(git status --porcelain -- plugins)"
          if [[ -n "$changed" ]]; then
            echo 'Plugin files are out of date with package.json or mods/.' >&2
            echo 'Run npm run build and commit plugins/.' >&2
            echo "$changed" >&2
            exit 1
          fi
      - name: Check Playwright image tags
        shell: bash
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")"
          image="mcr.microsoft.com/playwright:v${version}-noble"
          for file in Dockerfile docs/ci.mdx; do
            if ! grep -qF "$image" "$file"; then
              echo "$file must use $image (playwright $version in package-lock.json)." >&2
              exit 1
            fi
          done
